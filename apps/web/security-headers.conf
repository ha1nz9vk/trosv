# Shared security headers. Included by nginx.conf at server level AND in
# every location that declares its own add_header - nginx drops inherited
# headers whenever a block defines even one add_header of its own.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Only effective once TLS terminates in front; kept modest until stable.
add_header Strict-Transport-Security "max-age=15552000" always;
